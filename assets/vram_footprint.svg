<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="880" height="540" rx="14" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="38" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700">
    ⚡ Pegada de Memória Unificada dos Modelos Locais (Apple Silicon M4 - 16 GB RAM)
  </text>
  <text x="36" y="58" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12">
    Fábrica de Tokens Tier 0: Co-residência e Time-Slicing vs Teto Seguro de 8.5 GB VRAM (Sem Swap de Disco)
  </text>

  <!-- Safe Limit Line (8.5 GB) -->
  <line x1="680" y1="75" x2="680" y2="450" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="620" y="70" width="120" height="20" rx="4" fill="#ef4444" fill-opacity="0.2"/>
  <text x="680" y="84" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
    Teto Seguro: 8.5 GB
  </text>

  <!-- Bars Container -->
  <!-- 1. nomic-embed-text (0.31 GB) -->
  <text x="36" y="105" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">nomic-embed-text</text>
  <text x="180" y="105" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Embeddings / RAG</text>
  <rect x="330" y="93" width="22" height="15" rx="3" fill="url(#highlightGrad)"/>
  <text x="358" y="105" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">0.31 GB</text>

  <!-- 2. deepseek-r1:1.5b (0.91 GB) -->
  <text x="36" y="139" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">deepseek-r1:1.5b</text>
  <text x="180" y="139" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Auditor Cético / Raciocínio</text>
  <rect x="330" y="127" width="65" height="15" rx="3" fill="url(#highlightGrad)"/>
  <text x="402" y="139" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">0.91 GB (78.0 t/s)</text>

  <!-- 3. smollm2:1.7b (0.98 GB) -->
  <text x="36" y="173" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">smollm2:1.7b</text>
  <text x="180" y="173" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Micro-Worker / BNF Patch</text>
  <rect x="330" y="161" width="70" height="15" rx="3" fill="url(#barGrad)"/>
  <text x="408" y="173" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">0.98 GB (50.0 t/s)</text>

  <!-- 4. qwen2.5:1.5b (1.20 GB) -->
  <text x="36" y="207" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">qwen2.5:1.5b</text>
  <text x="180" y="207" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Tool-Calling &amp; BNF Router</text>
  <rect x="330" y="195" width="85" height="15" rx="3" fill="url(#barGrad)"/>
  <text x="423" y="207" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">1.20 GB (80.0 t/s)</text>

  <!-- 5. granite3.1-dense:2b (1.60 GB) -->
  <text x="36" y="241" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">granite3.1-dense:2b</text>
  <text x="180" y="241" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Síntese de Testes &amp; QA</text>
  <rect x="330" y="229" width="114" height="15" rx="3" fill="url(#barGrad)"/>
  <text x="452" y="241" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">1.60 GB (50.0 t/s)</text>

  <!-- 6. qwen2.5-coder:3b (1.88 GB) -->
  <text x="36" y="275" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">qwen2.5-coder:3b</text>
  <text x="180" y="275" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">JSON &amp; Regex Extractor</text>
  <rect x="330" y="263" width="134" height="15" rx="3" fill="url(#barGrad)"/>
  <text x="472" y="275" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">1.88 GB (41.8 t/s)</text>

  <!-- 7. starcoder2:3b (2.10 GB) -->
  <text x="36" y="309" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">starcoder2:3b</text>
  <text x="180" y="309" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">FIM &amp; Patches Ponytail</text>
  <rect x="330" y="297" width="150" height="15" rx="3" fill="url(#barGrad)"/>
  <text x="488" y="309" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">2.10 GB (45.0 t/s)</text>

  <!-- 8. phi4-mini:3.8b (2.50 GB) -->
  <text x="36" y="343" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">phi4-mini:3.8b</text>
  <text x="180" y="343" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Lógica Formal &amp; Invariantes</text>
  <rect x="330" y="331" width="178" height="15" rx="3" fill="url(#highlightGrad)"/>
  <text x="516" y="343" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">2.50 GB (42.0 t/s)</text>

  <!-- 9. hermes3:3b (2.00 GB) -->
  <text x="36" y="377" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">hermes3:3b</text>
  <text x="180" y="377" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Destilação BDI de Sessão</text>
  <rect x="330" y="365" width="143" height="15" rx="3" fill="url(#barGrad)"/>
  <text x="481" y="377" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">2.00 GB (35.0 t/s)</text>

  <!-- 10. qwen2.5-coder:7b (4.43 GB) -->
  <text x="36" y="411" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">qwen2.5-coder:7b</text>
  <text x="180" y="411" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Builder / Síntese de Módulos</text>
  <rect x="330" y="399" width="316" height="15" rx="3" fill="url(#highlightGrad)"/>
  <text x="654" y="411" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">4.43 GB (20.1 t/s)</text>

  <!-- Footer Info Box -->
  <g transform="translate(36, 440)">
    <rect width="808" height="74" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="20" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">
      🟢 Perfis de Time-Slicing Neural (Sem Swap de Disco · Folga &gt; 10 GB RAM para macOS):
    </text>
    <text x="20" y="44" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      • <tspan fill="#4ade80" font-weight="600">Síntese &amp; Auditoria:</tspan> Qwen 7B (4.43 GB) + DeepSeek 1.5B (0.91 GB) = <tspan fill="#38bdf8" font-weight="700">5.34 GB VRAM</tspan>
      • <tspan fill="#4ade80" font-weight="600">Lógica Formal &amp; RAG:</tspan> Phi-4 Mini (2.50 GB) + DeepSeek 1.5B (0.91 GB) + Nomic (0.31 GB) = <tspan fill="#38bdf8" font-weight="700">3.72 GB VRAM</tspan>
    </text>
    <text x="20" y="62" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      • <tspan fill="#4ade80" font-weight="600">Patches Cirúrgicos &amp; Testes:</tspan> StarCoder2 (2.10 GB) + Granite (1.60 GB) = <tspan fill="#38bdf8" font-weight="700">3.70 GB VRAM</tspan>
      • <tspan fill="#4ade80" font-weight="600">MCP Router Rápido:</tspan> Qwen 1.5B (1.20 GB) + SmolLM2 (0.98 GB) = <tspan fill="#38bdf8" font-weight="700">2.18 GB VRAM</tspan>
    </text>
  </g>
</svg>