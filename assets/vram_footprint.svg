<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="880" height="420" rx="14" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="44" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">
    ⚡ Pegada de Memória Unificada dos Modelos Locais (Apple Silicon M4 - 16 GB RAM)
  </text>
  <text x="36" y="68" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
    Co-residência de modelos em VRAM Metal GPU vs Teto Máximo Seguro de 8.5 GB (Sem Swap de Disco)
  </text>

  <!-- Safe Limit Line (8.5 GB) -->
  <line x1="680" y1="90" x2="680" y2="350" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="620" y="86" width="120" height="22" rx="4" fill="#ef4444" fill-opacity="0.2"/>
  <text x="680" y="101" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
    Teto Seguro: 8.5 GB
  </text>

  <!-- Bars Container -->
  <!-- 1. nomic-embed-text (0.31 GB) -->
  <text x="36" y="132" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">nomic-embed-text</text>
  <text x="180" y="132" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Embeddings / RAG</text>
  <rect x="330" y="118" width="22" height="18" rx="4" fill="url(#highlightGrad)"/>
  <text x="360" y="132" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">0.31 GB</text>

  <!-- 2. deepseek-r1:1.5b (0.91 GB) -->
  <text x="36" y="168" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">deepseek-r1:1.5b</text>
  <text x="180" y="168" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Auditor Cético / Red-Team</text>
  <rect x="330" y="154" width="65" height="18" rx="4" fill="url(#highlightGrad)"/>
  <text x="405" y="168" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">0.91 GB (78.0 t/s)</text>

  <!-- 3. smollm2:1.7b (1.00 GB) -->
  <text x="36" y="204" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">smollm2:1.7b</text>
  <text x="180" y="204" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Micro-Worker / BNF Patch</text>
  <rect x="330" y="190" width="71" height="18" rx="4" fill="url(#barGrad)"/>
  <text x="410" y="204" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">1.00 GB</text>

  <!-- 4. qwen2.5-coder:3b (1.88 GB) -->
  <text x="36" y="240" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">qwen2.5-coder:3b</text>
  <text x="180" y="240" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">JSON &amp; Regex Extractor</text>
  <rect x="330" y="226" width="134" height="18" rx="4" fill="url(#barGrad)"/>
  <text x="475" y="240" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">1.88 GB (41.8 t/s)</text>

  <!-- 5. hermes3:3b (2.00 GB) -->
  <text x="36" y="276" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">hermes3:3b</text>
  <text x="180" y="276" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Destilação BDI de Sessão</text>
  <rect x="330" y="262" width="143" height="18" rx="4" fill="url(#barGrad)"/>
  <text x="485" y="276" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">2.00 GB</text>

  <!-- 6. qwen2.5-coder:7b (4.43 GB) -->
  <text x="36" y="312" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">qwen2.5-coder:7b</text>
  <text x="180" y="312" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Builder / Code Synthesis</text>
  <rect x="330" y="298" width="316" height="18" rx="4" fill="url(#highlightGrad)"/>
  <text x="655" y="312" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">4.43 GB (20.1 t/s)</text>

  <!-- Footer Info Box -->
  <rect x="36" y="345" width="808" height="52" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="52" y="375" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">
    🟢 Tríade Ativa Atual (Co-residência Tripla):
  </text>
  <text x="330" y="375" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">
    Qwen 7B (4.43 GB) + DeepSeek 1.5B (0.91 GB) + Nomic (0.31 GB) = <tspan fill="#4ade80" font-weight="700">4.74 GB VRAM</tspan> (<tspan fill="#38bdf8" font-weight="700">&gt;11 GB Livres no macOS</tspan>)
  </text>
</svg>
