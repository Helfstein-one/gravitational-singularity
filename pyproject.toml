[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gravitational-singularity"
version = "0.2.0"
description = "Antigravity Supercharged: Local AI & Token Optimization Engine for Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
]

[project.scripts]
ast-search = "gravitational_singularity.ast_search_cli:main"
singularity = "gravitational_singularity.doctor_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "gravitational_singularity*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E741", "W293"]


