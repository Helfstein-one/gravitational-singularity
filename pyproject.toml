[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gravitational-singularity"
version = "0.2.0"
description = "Antigravity Supercharged: Local AI & Token Optimization Engine for Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
ast-search = "src.adapters.inbound.ast_search_cli:main"
singularity = "src.adapters.inbound.doctor_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
"gravitational_singularity" = "src/gravitational_singularity"
