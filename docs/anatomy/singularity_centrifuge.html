<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Fig 1 — Centrífuga Gravitacional de Tokens</title>
  <style>
    :root {
      --bg: #090d13;
      --card-bg: #121820;
      --border: #263242;
      --text: #94a3b8;
      --text-bright: #f8fafc;
      --accent-cyan: #38bdf8;
      --accent-gold: #f59e0b;
      --accent-green: #22c55e;
      --accent-purple: #c084fc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .figure-card {
      width: 1000px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .card-header .fig-num { font-weight: 700; color: var(--accent-cyan); letter-spacing: 0.5px; }
    .card-header .title { font-weight: 600; color: var(--text-bright); }
    .canvas-container {
      position: relative;
      width: 100%;
      height: 600px;
      background: radial-gradient(circle at 50% 50%, #151d28 0%, #0c1118 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    svg { width: 100%; height: 100%; }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      font-size: 12px;
    }
    .hint { color: #64748b; }
    .readout { font-weight: 700; color: var(--accent-green); font-family: monospace; font-size: 13px; }
    
    /* Interactive gauges */
    .needle { transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); transform-origin: center; }
    .pulse-glow { animation: pulse 3s infinite ease-in-out; }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 10px var(--accent-cyan)); }
      50% { opacity: 0.8; filter: drop-shadow(0 0 25px var(--accent-purple)); }
    }
    .rotator { animation: rotate 12s linear infinite; transform-origin: 500px 320px; }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="figure-card">
    <div class="card-header">
      <span class="fig-num">FIG. 1.0 — ANATOMIA DA MÁQUINA</span>
      <span class="title">Centrífuga Gravitacional de Tokens • Bancada de Calibração M-Series</span>
    </div>

    <div class="canvas-container">
      <svg viewBox="0 0 1000 600">
        <defs>
          <linearGradient id="metal-base" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2a3545"/>
            <stop offset="50%" stop-color="#1b2430"/>
            <stop offset="100%" stop-color="#0f1620"/>
          </linearGradient>
          <linearGradient id="glass-tube" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="rgba(56,189,248,0.2)"/>
            <stop offset="50%" stop-color="rgba(255,255,255,0.05)"/>
            <stop offset="100%" stop-color="rgba(192,132,252,0.25)"/>
          </linearGradient>
          <linearGradient id="vortex-glow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="50%" stop-color="#818cf8"/>
            <stop offset="100%" stop-color="#c084fc"/>
          </linearGradient>
          <radialGradient id="singularity-core" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="30%" stop-color="#38bdf8"/>
            <stop offset="70%" stop-color="#a855f7"/>
            <stop offset="100%" stop-color="transparent"/>
          </radialGradient>
        </defs>

        <!-- Base Isométrica de Ferro Fundido -->
        <g id="heavy-base">
          <!-- Pés de Nivelamento serrilhados -->
          <ellipse cx="200" cy="510" rx="30" ry="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
          <ellipse cx="800" cy="510" rx="30" ry="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
          <ellipse cx="500" cy="545" rx="35" ry="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>

          <!-- Placa da Base Principal -->
          <polygon points="500,420 860,470 500,530 140,470" fill="url(#metal-base)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
          <polygon points="140,470 500,530 500,542 140,482" fill="#131b26" stroke="#1e293b" stroke-width="1"/>
          <polygon points="860,470 500,530 500,542 860,482" fill="#0c121a" stroke="#1e293b" stroke-width="1"/>

          <!-- Régua Gravada de Milímetros na Borda -->
          <path d="M160,472 L480,526" stroke="#475569" stroke-width="1" stroke-dasharray="2,6"/>
          <path d="M520,526 L840,472" stroke="#475569" stroke-width="1" stroke-dasharray="2,6"/>

          <!-- Plaqueta de Identificação em Latão Polido -->
          <polygon points="460,518 540,518 535,528 465,528" fill="#d97706" stroke="#f59e0b" stroke-width="1"/>
          <text x="500" y="526" fill="#451a03" font-size="6" font-weight="bold" text-anchor="middle" letter-spacing="0.5">MOD. M-SERIES 16GB</text>
        </g>

        <!-- Tubulação de Cobre e Conduítes de Bypass AST -->
        <g id="plumbing">
          <path d="M260,370 C260,430 380,450 440,450" fill="none" stroke="#b45309" stroke-width="6" stroke-linecap="round"/>
          <path d="M740,370 C740,430 620,450 560,450" fill="none" stroke="#b45309" stroke-width="6" stroke-linecap="round"/>
          <!-- Anéis de Compressão -->
          <ellipse cx="260" cy="375" rx="7" ry="3" fill="#f59e0b"/>
          <ellipse cx="740" cy="375" rx="7" ry="3" fill="#f59e0b"/>
        </g>

        <!-- Colunas de Suporte de Aço e Molas Guia -->
        <g id="support-pillars">
          <!-- Coluna Esquerda -->
          <rect x="330" y="220" width="12" height="230" fill="#334155" stroke="#475569" rx="2"/>
          <!-- Coluna Direita -->
          <rect x="658" y="220" width="12" height="230" fill="#334155" stroke="#475569" rx="2"/>
        </g>

        <!-- Vórtice Central da Singularidade e Câmara de Vidro de Borossilicato -->
        <g id="centrifuge-core">
          <!-- Anel de Pressão Superior -->
          <ellipse cx="500" cy="200" rx="90" ry="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
          <ellipse cx="500" cy="200" rx="75" ry="18" fill="#0f172a" stroke="#475569" stroke-width="1"/>

          <!-- Cilindro de Vidro com Marcadores de Nível de Compressão -->
          <path d="M410,200 L410,400 C410,425 590,425 590,400 L590,200" fill="url(#glass-tube)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>

          <!-- Linhas de Calibração do Vidro -->
          <line x1="414" y1="260" x2="430" y2="260" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
          <text x="435" y="263" fill="#38bdf8" font-size="9" font-family="monospace">8.6x MAX</text>
          <line x1="414" y1="310" x2="426" y2="310" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.6"/>
          <text x="432" y="313" fill="#94a3b8" font-size="8" font-family="monospace">5.0x NOM</text>
          <line x1="414" y1="360" x2="422" y2="360" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.4"/>
          <text x="428" y="363" fill="#64748b" font-size="8" font-family="monospace">1.0x RAW</text>

          <!-- Núcleo Rotativo da Singularidade Gravitacional -->
          <g class="rotator">
            <ellipse cx="500" cy="320" rx="60" ry="14" fill="none" stroke="url(#vortex-glow)" stroke-width="2" stroke-dasharray="10,5"/>
            <ellipse cx="500" cy="320" rx="40" ry="8" fill="none" stroke="#38bdf8" stroke-width="2"/>
            <ellipse cx="500" cy="320" rx="20" ry="4" fill="none" stroke="#ffffff" stroke-width="1.5"/>
          </g>

          <!-- Ponto de Densidade Infinita da Singularidade -->
          <circle cx="500" cy="320" r="18" fill="url(#singularity-core)" class="pulse-glow"/>
          <circle cx="500" cy="320" r="4" fill="#ffffff"/>

          <!-- Anel de Vedação Inferior -->
          <ellipse cx="500" cy="405" rx="85" ry="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
        </g>

        <!-- Manômetros e Relógios Analógicos Calibrados -->
        <g id="instruments">
          <!-- Instrumento 1: Manômetro de Fator de Redução (Esquerda Alto) -->
          <g transform="translate(260, 240)">
            <circle cx="0" cy="0" r="44" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
            <circle cx="0" cy="0" r="38" fill="#1e293b" stroke="#334155" stroke-width="1"/>
            <!-- Escala Circular de Ticks -->
            <path d="M-25,15 A30,30 0 1,1 25,15" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="3,6"/>
            <!-- Agulha -->
            <line x1="0" y1="0" x2="16" y2="-22" stroke="#22c55e" stroke-width="2" stroke-linecap="round" class="needle"/>
            <circle cx="0" cy="0" r="4" fill="#f8fafc"/>
            <text x="0" y="24" fill="#f8fafc" font-size="8" font-weight="bold" text-anchor="middle">8.6x REDUÇÃO</text>
            <text x="0" y="-12" fill="#22c55e" font-size="7" font-weight="bold" text-anchor="middle">88.5% EFIC</text>
          </g>

          <!-- Instrumento 2: Manômetro de Latência In-Memory AST (Direita Alto) -->
          <g transform="translate(740, 240)">
            <circle cx="0" cy="0" r="44" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
            <circle cx="0" cy="0" r="38" fill="#1e293b" stroke="#334155" stroke-width="1"/>
            <path d="M-25,15 A30,30 0 1,1 25,15" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="3,6"/>
            <!-- Agulha rápida apontando para zero -->
            <line x1="0" y1="0" x2="-22" y2="-12" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" class="needle"/>
            <circle cx="0" cy="0" r="4" fill="#f8fafc"/>
            <text x="0" y="24" fill="#f8fafc" font-size="8" font-weight="bold" text-anchor="middle">LATÊNCIA AST</text>
            <text x="0" y="-12" fill="#f59e0b" font-size="7" font-weight="bold" text-anchor="middle">0.26 ms RAM</text>
          </g>

          <!-- Instrumento 3: Coluna de VRAM Unificada (Esquerda Baixo) -->
          <g transform="translate(180, 340)">
            <rect x="0" y="0" width="22" height="90" fill="#0f172a" stroke="#64748b" rx="4"/>
            <!-- Nível de Mercúrio/VRAM 4.7 GB de 16GB -->
            <rect x="3" y="55" width="16" height="32" fill="#38bdf8" rx="2"/>
            <!-- Escalas na coluna -->
            <line x1="22" y1="20" x2="28" y2="20" stroke="#94a3b8" stroke-width="1"/>
            <text x="32" y="23" fill="#94a3b8" font-size="7">16G</text>
            <line x1="22" y1="55" x2="30" y2="55" stroke="#38bdf8" stroke-width="1.5"/>
            <text x="34" y="58" fill="#38bdf8" font-size="7" font-weight="bold">4.7G</text>
            <line x1="22" y1="85" x2="28" y2="85" stroke="#94a3b8" stroke-width="1"/>
            <text x="32" y="88" fill="#94a3b8" font-size="7">0G</text>
            <text x="11" y="105" fill="#f8fafc" font-size="7" font-weight="bold" text-anchor="middle">VRAM QWEN</text>
          </g>

          <!-- Instrumento 4: Tacômetro de Offload Local Metal (Direita Baixo) -->
          <g transform="translate(820, 340)">
            <circle cx="0" cy="30" r="36" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
            <circle cx="0" cy="30" r="30" fill="#1e293b" stroke="#334155" stroke-width="1"/>
            <line x1="0" y1="30" x2="12" y2="10" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
            <circle cx="0" cy="30" r="3" fill="#ffffff"/>
            <text x="0" y="50" fill="#f8fafc" font-size="7" font-weight="bold" text-anchor="middle">OFFLOAD LOCAL</text>
            <text x="0" y="20" fill="#c084fc" font-size="7" font-weight="bold" text-anchor="middle">~40 tok/s</text>
          </g>
        </g>
      </svg>
    </div>

    <div class="card-footer">
      <span class="hint">● O objeto é a explicação: o vórtice centrífugo suprime o ruído imperativo e destila a essência sintática</span>
      <span class="readout">STATUS: SINGULARIDADE ATIVA • 8.6x COMPRESSÃO • ZERO SWAP</span>
    </div>
  </div>

</body>
</html>
