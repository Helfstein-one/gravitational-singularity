[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --strict-markers

markers =
    unit: Unit tests for domain, mathematical models, and isolated application logic in RAM
    integration: Integration tests for real storage, SQLite, MMAP, and IPC adapters
    e2e: End-to-end tests for the complete execution pipeline and all-models council dispatch
    benchmark: Quantitative token reduction and compression benchmarks

filterwarnings =
    ignore::ResourceWarning
    ignore::UserWarning:multiprocessing.resource_tracker
