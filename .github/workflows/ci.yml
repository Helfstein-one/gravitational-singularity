name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Full Unit & Integration Test Suite
        run: |
          python3 -m unittest discover -s tests -v

      - name: Verify Architecture Graph Reachability (Zero Orphan Modules)
        run: |
          python3 scripts/reachability.py --check
