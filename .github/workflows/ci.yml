name: CI Tree Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # CAMADA 0: Path Filtering (dorny/paths-filter)
  # ==========================================================
  changes:
    name: 00 - Filter
    runs-on: ubuntu-latest
    outputs:
      core_py: ${{ steps.filter.outputs.core_py }}
      frontier: ${{ steps.filter.outputs.frontier }}
      adapters: ${{ steps.filter.outputs.adapters }}
      e2e: ${{ steps.filter.outputs.e2e }}
      benchmarks: ${{ steps.filter.outputs.benchmarks }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Path Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            core_py:
              - 'src/**/*.py'
              - 'scripts/**/*.py'
              - 'tests/unit/domain/**'
              - 'tests/unit/application/**'
              - 'pyproject.toml'
            frontier:
              - 'src/frontier/**'
              - 'tests/unit/frontier/**'
            adapters:
              - 'src/adapters/**'
              - 'tests/integration/**'
            e2e:
              - 'tests/e2e/**'
            benchmarks:
              - 'skills/ast-search/**'
              - 'tests/benchmarks/**'

  # ==========================================================
  # CAMADA 1: Gatekeeper Sintático & Alcance (< 30s)
  # ==========================================================
  gate_syntax:
    name: 01A - Syntax AST Compileall
    needs: changes
    if: needs.changes.outputs.core_py == 'true' || needs.changes.outputs.frontier == 'true' || needs.changes.outputs.adapters == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax & In-Memory AST Self-Compilation Gate
        run: |
          python3 -m compileall -q src scripts tests

  gate_reachability:
    name: 01B - Zero-Orphan Reachability
    needs: changes
    if: needs.changes.outputs.core_py == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Architecture Reachability Gate
        run: |
          python3 scripts/reachability.py --check

  # ==========================================================
  # CAMADA 2: Testes Unitários de Domínio & Aplicação
  # ==========================================================
  unit_domain:
    name: 02A - Unit Domain
    needs: [gate_syntax, gate_reachability]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Domain Unit Tests
        run: |
          pytest tests/unit/domain -v

  unit_application:
    name: 02B - Unit Application
    needs: [gate_syntax, gate_reachability]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Application Unit Tests
        run: |
          pytest tests/unit/application -v

  # ==========================================================
  # CAMADA 3: Fronteira & Integração de Adaptadores (I/O, Kernel & IPC)
  # ==========================================================
  unit_frontier:
    name: 03A - Unit Frontier (BitNet, PagedAttention, SMT & SHM)
    needs: [unit_domain, unit_application]
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Frontier Tests
        run: |
          pytest tests/unit/frontier -v

  integration_adapters:
    name: 03B - Integration (Storage, SQLite, Mmap & IPC)
    needs: [unit_domain, unit_application]
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Integration Tests
        run: |
          pytest tests/integration -v

  # ==========================================================
  # CAMADA 4: E2E Multi-Modelo & Benchmarks Quantitativos
  # ==========================================================
  e2e_council:
    name: 04A - E2E Council Dispatch (All Models)
    needs: [unit_frontier, integration_adapters]
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run E2E Model Council Verification
        run: |
          pytest tests/e2e/test_model_council_dispatch_e2e.py -v

  e2e_pipeline:
    name: 04B - E2E Unified Pipeline (Lifecycle & Disk Persistence)
    needs: [unit_frontier, integration_adapters]
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run E2E Full Pipeline Tests
        run: |
          pytest tests/e2e/test_full_pipeline_e2e.py -v

  benchmarks:
    name: 04C - Benchmarks (AST Compression & Token Reduction)
    needs: [unit_frontier, integration_adapters]
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Setup Local Proxy & CLI Link
        run: |
          mkdir -p ~/.local/bin
          ln -sf $(pwd)/skills/ast-search/bin/ast_extractor.py ~/.local/bin/ast-search
          chmod +x ~/.local/bin/ast-search
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Quantitative Reduction Benchmarks
        run: |
          pytest tests/benchmarks -v

  # ==========================================================
  # CAMADA 5: Gatekeeper Central para Regras de Proteção de Branch
  # ==========================================================
  status_gatekeeper:
    name: 05 - Branch Protection Gatekeeper
    if: always()
    needs:
      - changes
      - gate_syntax
      - gate_reachability
      - unit_domain
      - unit_application
      - unit_frontier
      - integration_adapters
      - e2e_council
      - e2e_pipeline
      - benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate DAG Workflow Results
        run: |
          RESULTS="${{ join(needs.*.result, ',') }}"
          echo "DAG node results: $RESULTS"
          if [[ "$RESULTS" =~ "failure" ]] || [[ "$RESULTS" =~ "cancelled" ]]; then
            echo "One or more required DAG jobs failed or were cancelled."
            exit 1
          fi
          echo "All required DAG jobs passed or were skipped successfully."
