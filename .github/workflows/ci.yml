name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pytest Test Runner
        run: |
          pip install --upgrade pip pytest

      - name: Stage 1 - In-Memory Syntax & AST Self-Compilation Gate
        run: |
          python3 -m compileall -q src scripts tests

      - name: Stage 2 - Architecture Reachability Gate (Zero-Orphans Enforcer)
        run: |
          python3 scripts/reachability.py --check

      - name: Stage 3 - Setup Local Execution Proxies
        run: |
          mkdir -p ~/.local/bin
          ln -sf $(pwd)/skills/ast-search/bin/ast_extractor.py ~/.local/bin/ast-search
          chmod +x ~/.local/bin/ast-search

      - name: Stage 4 - Granular Unit Tests (Domain, Application & Frontier Invariants)
        run: |
          pytest -m unit -v

      - name: Stage 5 - Granular Integration Tests (Storage, SQLite, Mmap & IPC)
        run: |
          pytest -m integration -v

      - name: Stage 6 - Granular End-to-End Tests (Council Dispatch & Full Pipeline)
        run: |
          pytest -m e2e -v

      - name: Stage 7 - Quantitative Benchmarks & AST Reduction Verification
        run: |
          pytest -m benchmark -v

      - name: Stage 8 - Complete Test Suite & Pytest Matrix Verification
        run: |
          pytest -v
