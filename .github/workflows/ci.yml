name: CI Tree Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # NÍVEL 0: Gatekeeper Sintático & Alcance (< 5s)
  # ==========================================================
  gate_syntax:
    name: 01A - Syntax AST Compileall
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax & In-Memory AST Self-Compilation Gate
        run: |
          python3 -m compileall -q src scripts tests

  gate_reachability:
    name: 01B - Zero-Orphan Reachability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Architecture Reachability Gate
        run: |
          python3 scripts/reachability.py --check

  # ==========================================================
  # NÍVEL 1: Grid Paralelo Granular (Domínio, Aplicação, Fronteira & Integração)
  # ==========================================================
  unit_domain:
    name: 02A - Domain Entities & Invariants
    needs: [gate_syntax, gate_reachability]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock

      - name: Run Domain Unit Tests
        run: |
          pytest tests/unit/domain -v

  unit_app_cases:
    name: 02B - App Use Cases & Lifecycle
    needs: [gate_syntax, gate_reachability]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock

      - name: Run Use Cases & Pipeline Tests
        run: |
          pytest tests/unit/application/test_use_cases.py tests/unit/application/test_unified_pipeline.py -v

  unit_app_skeletonizer:
    name: 02C - AST Skeletonizer (>60% Reduction)
    needs: [gate_syntax, gate_reachability]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock

      - name: Run Code Skeletonizer Tests
        run: |
          pytest tests/unit/application/test_code_skeletonizer.py -v

  unit_app_merkle:
    name: 02D - Merkle Tree Engine (>85% Diff Reduction)
    needs: [gate_syntax, gate_reachability]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock

      - name: Run AST Merkle Engine Tests
        run: |
          pytest tests/unit/application/test_ast_merkle_engine.py -v

  unit_app_intelligence:
    name: 02E - Adversarial Reflector & Cascade
    needs: [gate_syntax, gate_reachability]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock

      - name: Run Adversarial Reflector & Cascade Tests
        run: |
          pytest tests/unit/application/test_adversarial_reflector.py tests/unit/application/test_hierarchical_cascade.py tests/unit/application/test_context_squeezer.py -v

  unit_app_caching:
    name: 02F - Epistemic Cache & Inference Optimizer
    needs: [gate_syntax, gate_reachability]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock

      - name: Run Cache & Optimizer Tests
        run: |
          pytest tests/unit/application/test_epistemic_cache.py tests/unit/application/test_inference_optimizer.py tests/unit/application/test_pre_warmer.py -v

  unit_frontier_extensions:
    name: 02G - Vector Accelerate & Consensus
    needs: [gate_syntax, gate_reachability]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock

      - name: Run Frontier Extensions Tests
        run: |
          pytest tests/unit/frontier/test_frontier_extensions.py tests/unit/frontier/test_high_performance_extensions.py -v

  unit_frontier_extreme:
    name: 02H - SMT Gate, BitNet & Shared Memory
    needs: [gate_syntax, gate_reachability]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock

      - name: Run Extreme Frontiers & SHM Tests
        run: |
          pytest tests/unit/frontier/test_extreme_frontiers.py tests/unit/frontier/test_shared_memory.py -v

  integration_storage:
    name: 02I - Storage, SQLite WAL & IPC Mmap
    needs: [gate_syntax, gate_reachability]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock

      - name: Run Storage & IPC Integration Tests
        run: |
          pytest tests/integration/test_storage_and_ipc_integration.py -v

  integration_adapters:
    name: 02J - Adapters (MCP Stdio, Telemetry HTTP & CLI)
    needs: [gate_syntax, gate_reachability]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock

      - name: Run Integration Adapters Tests
        run: |
          pytest tests/integration/test_adapters.py -v

  # ==========================================================
  # NÍVEL 2: Execução Paralela E2E & Benchmarks Quantitativos
  # ==========================================================
  e2e_council:
    name: 03A - E2E Model Council Verification
    needs:
      - unit_domain
      - unit_app_cases
      - unit_app_skeletonizer
      - unit_app_merkle
      - unit_app_intelligence
      - unit_app_caching
      - unit_frontier_extensions
      - unit_frontier_extreme
      - integration_storage
      - integration_adapters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock

      - name: Run E2E Model Council Tests
        run: |
          pytest tests/e2e/test_model_council_dispatch_e2e.py -v

  e2e_pipeline:
    name: 03B - E2E Pipeline Lifecycle & Persistence
    needs:
      - unit_domain
      - unit_app_cases
      - unit_app_skeletonizer
      - unit_app_merkle
      - unit_app_intelligence
      - unit_app_caching
      - unit_frontier_extensions
      - unit_frontier_extreme
      - integration_storage
      - integration_adapters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock

      - name: Run E2E Full Pipeline Tests
        run: |
          pytest tests/e2e/test_full_pipeline_e2e.py -v

  benchmarks_skills:
    name: 03C - Benchmarks Skills Reduction (>=60%)
    needs:
      - unit_domain
      - unit_app_cases
      - unit_app_skeletonizer
      - unit_app_merkle
      - unit_app_intelligence
      - unit_app_caching
      - unit_frontier_extensions
      - unit_frontier_extreme
      - integration_storage
      - integration_adapters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock

      - name: Setup Local Proxy & CLI Link
        run: |
          mkdir -p ~/.local/bin
          ln -sf $(pwd)/skills/ast-search/bin/ast_extractor.py ~/.local/bin/ast-search
          chmod +x ~/.local/bin/ast-search
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Quantitative Reduction Benchmarks
        run: |
          pytest tests/benchmarks -v

  benchmarks_harness:
    name: 03D - Benchmarks 4-Tier E2E Harness
    needs:
      - unit_domain
      - unit_app_cases
      - unit_app_skeletonizer
      - unit_app_merkle
      - unit_app_intelligence
      - unit_app_caching
      - unit_frontier_extensions
      - unit_frontier_extreme
      - integration_storage
      - integration_adapters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Local Proxy & CLI Link
        run: |
          mkdir -p ~/.local/bin
          ln -sf $(pwd)/skills/ast-search/bin/ast_extractor.py ~/.local/bin/ast-search
          chmod +x ~/.local/bin/ast-search
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Standalone Quantitative Benchmark Harness
        run: |
          python3 tests/benchmark_skills.py

  # ==========================================================
  # NÍVEL 3: Gatekeeper Central & Relatório de Telemetria
  # ==========================================================
  status_gatekeeper:
    name: 04 - Branch Protection Gatekeeper & Report
    if: always()
    needs:
      - gate_syntax
      - gate_reachability
      - unit_domain
      - unit_app_cases
      - unit_app_skeletonizer
      - unit_app_merkle
      - unit_app_intelligence
      - unit_app_caching
      - unit_frontier_extensions
      - unit_frontier_extreme
      - integration_storage
      - integration_adapters
      - e2e_council
      - e2e_pipeline
      - benchmarks_skills
      - benchmarks_harness
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary Report & Enforce Branch Protection
        run: |
          echo "## 🌌 Event Horizon - Árvore de Execução do CI (Granular & Paralelo)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Nó da Árvore | Camada | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| **01A - Syntax AST Compileall** | Nível 0: Gatekeeper | ${{ needs.gate_syntax.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **01B - Zero-Orphan Reachability** | Nível 0: Gatekeeper | ${{ needs.gate_reachability.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **02A - Domain Entities & Invariants** | Nível 1: Unidade Paralela | ${{ needs.unit_domain.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **02B - App Use Cases & Lifecycle** | Nível 1: Unidade Paralela | ${{ needs.unit_app_cases.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **02C - AST Skeletonizer (>60%)** | Nível 1: Unidade Paralela | ${{ needs.unit_app_skeletonizer.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **02D - Merkle Tree Engine (>85%)** | Nível 1: Unidade Paralela | ${{ needs.unit_app_merkle.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **02E - Adversarial Reflector & Cascade** | Nível 1: Unidade Paralela | ${{ needs.unit_app_intelligence.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **02F - Epistemic Cache & Optimizer** | Nível 1: Unidade Paralela | ${{ needs.unit_app_caching.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **02G - Vector Accelerate & Consensus** | Nível 1: Unidade Paralela | ${{ needs.unit_frontier_extensions.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **02H - SMT Gate, BitNet & SHM** | Nível 1: Unidade Paralela | ${{ needs.unit_frontier_extreme.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **02I - Storage, SQLite WAL & IPC Mmap** | Nível 1: Integração Paralela | ${{ needs.integration_storage.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **02J - Adapters (MCP, HTTP, CLI)** | Nível 1: Integração Paralela | ${{ needs.integration_adapters.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **03A - E2E Model Council Verification** | Nível 2: E2E Paralelo | ${{ needs.e2e_council.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **03B - E2E Pipeline Lifecycle & Disk** | Nível 2: E2E Paralelo | ${{ needs.e2e_pipeline.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **03C - Benchmarks Skills Reduction (>=60%)** | Nível 2: Benchmarks Paralelo | ${{ needs.benchmarks_skills.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **03D - Benchmarks 4-Tier E2E Harness** | Nível 2: Benchmarks Paralelo | ${{ needs.benchmarks_harness.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          RESULTS="${{ join(needs.*.result, ',') }}"
          echo "DAG node results: $RESULTS"
          if [[ "$RESULTS" =~ "failure" ]] || [[ "$RESULTS" =~ "cancelled" ]]; then
            echo "❌ **Veredito:** Falha detectada em um ou mais nós da árvore de CI." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ **Veredito:** Todos os 16 nós granulares da árvore foram executados e aprovados com 100% de sucesso!" >> $GITHUB_STEP_SUMMARY
