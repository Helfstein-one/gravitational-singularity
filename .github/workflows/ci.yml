name: CI Tree Pipeline (Hiper-Granular)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # NÍVEL 0: Gates de Entrada (Sintaxe e Topologia do Código)
  # ============================================================================
  gate-syntax:
    name: 🛡️ Gate 0A: AST & Compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - name: Bytecode & AST Verification
        run: python3 -m compileall -q src scripts tests

  gate-reachability:
    name: 🕸️ Gate 0B: Zero-Orphan Reachability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - name: Check Graph Reachability
        run: python3 scripts/reachability.py --check

  # ============================================================================
  # NÍVEL 1: Unidade de Lógica Pura (Linux, Rápido, Paralelo)
  # ============================================================================
  unit-domain:
    name: 🧪 Unit: Domain Logic
    needs: [gate-syntax, gate-reachability]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: pytest tests/unit/domain -v

  unit-application:
    name: ⚙️ Unit: Application Use-Cases
    needs: [gate-syntax, gate-reachability]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: pytest tests/unit/application -v

  unit-ast-parser:
    name: 🧠 Unit: AST Search & Pruning
    needs: [gate-syntax, gate-reachability]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: pytest tests/unit/parser -v

  unit-schemas:
    name: 🗃️ Unit: Contracts & Schemas
    needs: [gate-syntax, gate-reachability]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: pytest tests/unit/schemas -v

  # ============================================================================
  # NÍVEL 2: Fronteira & Adaptadores (Kernel I/O, Memória e Arquitetura Apple)
  # ============================================================================
  frontier-bitnet:
    name: 🔬 Frontier: BitNet Quantization
    needs: [gate-syntax, gate-reachability]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: pytest tests/unit/frontier/test_bitnet.py -v

  frontier-paged-attn:
    name: ⚡ Frontier: PagedAttention SMT
    needs: [gate-syntax, gate-reachability]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: pytest tests/unit/frontier/test_paged_attention.py -v

  adapter-storage:
    name: 💾 Integration: SQLite WAL & Storage
    needs: [gate-syntax, gate-reachability]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: pytest tests/integration/storage -v

  adapter-ipc-shm:
    name: 📬 Integration: IPC & Shared Memory (SHM)
    needs: [gate-syntax, gate-reachability]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: pytest tests/integration/ipc -v

  # ============================================================================
  # NÍVEL 3: E2E Multi-Modelo & Benchmarks Quantitativos
  # ============================================================================
  e2e-council:
    name: 👥 E2E: Council Dispatch
    needs:
      - unit-domain
      - unit-application
      - unit-ast-parser
      - unit-schemas
      - frontier-bitnet
      - frontier-paged-attn
      - adapter-storage
      - adapter-ipc-shm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: pytest tests/e2e/test_model_council_dispatch_e2e.py -v

  e2e-pipeline:
    name: ⚙️ E2E: Full Lifecycle Pipeline
    needs:
      - unit-domain
      - unit-application
      - unit-ast-parser
      - unit-schemas
      - frontier-bitnet
      - frontier-paged-attn
      - adapter-storage
      - adapter-ipc-shm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: pytest tests/e2e/test_full_pipeline_e2e.py -v

  benchmarks:
    name: 📈 Benchmarks: AST & Token Compression
    needs:
      - unit-domain
      - unit-application
      - unit-ast-parser
      - unit-schemas
      - frontier-bitnet
      - frontier-paged-attn
      - adapter-storage
      - adapter-ipc-shm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - name: Register AST Extractor CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(pwd)/skills/ast-search/bin/ast_extractor.py" "$HOME/.local/bin/ast-search"
          chmod +x "$HOME/.local/bin/ast-search"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: pytest tests/benchmarks -v

  # ============================================================================
  # NÍVEL 4: Nó de Veredito & Agregação Granular
  # ============================================================================
  ci-verdict:
    name: 📊 CI Verdict & Telemetry Dashboard
    needs:
      - gate-syntax
      - gate-reachability
      - unit-domain
      - unit-application
      - unit-ast-parser
      - unit-schemas
      - frontier-bitnet
      - frontier-paged-attn
      - adapter-storage
      - adapter-ipc-shm
      - e2e-council
      - e2e-pipeline
      - benchmarks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Consolidated Step Summary
        run: |
          format_status() {
            case "$1" in
              "success") echo "✅ PASS" ;;
              "skipped") echo "⏭️ SKIPPED" ;;
              "cancelled") echo "⏹️ CANCELLED" ;;
              *) echo "❌ FAIL" ;;
            esac
          }

          RESULTS=(
            "${{ needs.gate-syntax.result }}"
            "${{ needs.gate-reachability.result }}"
            "${{ needs.unit-domain.result }}"
            "${{ needs.unit-application.result }}"
            "${{ needs.unit-ast-parser.result }}"
            "${{ needs.unit-schemas.result }}"
            "${{ needs.frontier-bitnet.result }}"
            "${{ needs.frontier-paged-attn.result }}"
            "${{ needs.adapter-storage.result }}"
            "${{ needs.adapter-ipc-shm.result }}"
            "${{ needs.e2e-council.result }}"
            "${{ needs.e2e-pipeline.result }}"
            "${{ needs.benchmarks.result }}"
          )

          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🌌 Event Horizon - Telemetria Hiper-Granular da Árvore

          | Camada | Sub-módulo / Nó | Runner | Status |
          | :--- | :--- | :---: | :---: |
          | **Nível 0: Gatekeeper** | 🛡️ Syntax & AST Compileall | `ubuntu` | $(format_status "${RESULTS[0]}") |
          | **Nível 0: Gatekeeper** | 🕸️ Zero-Orphan Reachability | `ubuntu` | $(format_status "${RESULTS[1]}") |
          | **Nível 1: Unit Core**  | 🧪 Domain Entities & Invariants | `ubuntu` | $(format_status "${RESULTS[2]}") |
          | **Nível 1: Unit Core**  | ⚙️ Application Use-Cases | `ubuntu` | $(format_status "${RESULTS[3]}") |
          | **Nível 1: Unit Core**  | 🧠 AST Search & Pruning Engine | `ubuntu` | $(format_status "${RESULTS[4]}") |
          | **Nível 1: Unit Core**  | 🗃️ Pydantic/Data Schemas | `ubuntu` | $(format_status "${RESULTS[5]}") |
          | **Nível 2: Frontier**   | 🔬 BitNet 1.58b Quantization | `macos` | $(format_status "${RESULTS[6]}") |
          | **Nível 2: Frontier**   | ⚡ PagedAttention SMT | `macos` | $(format_status "${RESULTS[7]}") |
          | **Nível 2: Adapters**   | 💾 SQLite WAL Storage | `ubuntu` | $(format_status "${RESULTS[8]}") |
          | **Nível 2: Adapters**   | 📬 IPC POSIX Shared Memory | `macos` | $(format_status "${RESULTS[9]}") |
          | **Nível 3: E2E**        | 👥 Council Dispatch (7 Personas) | `ubuntu` | $(format_status "${RESULTS[10]}") |
          | **Nível 3: E2E**        | ⚙️ Full Pipeline Disk Lifecycle | `ubuntu` | $(format_status "${RESULTS[11]}") |
          | **Nível 3: Benchmarks** | 📈 AST & Token Reduction Gate | `ubuntu` | $(format_status "${RESULTS[12]}") |

          EOF

          for res in "${RESULTS[@]}"; do
            if [ "$res" != "success" ]; then
              echo "❌ **Veredito:** Falha detectada em um ou mais nós críticos da esteira." >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
          done

          echo "✅ **Veredito:** Todos os 13 nós especializados foram aprovados com 100% de sucesso!" >> $GITHUB_STEP_SUMMARY
          exit 0
