name: Jules Issue Automation

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: read

jobs:
  invoke-jules:
    name: Invoke Jules for labeled issue
    if: >-
      github.event.label.name == 'jules' &&
      github.event.issue.user.login == 'Helfstein-one'
    runs-on: ubuntu-latest
    steps:
      - name: Invoke Jules
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: main
          include_last_commit: true
          include_commit_log: true
          prompt: |
            Implement the GitHub issue below in this repository.

            Issue: #${{ github.event.issue.number }}
            Title: ${{ github.event.issue.title }}

            Description:
            ${{ github.event.issue.body }}

            Requirements:
            - Work only on this issue's scope.
            - Inspect the repository before editing.
            - Preserve existing behavior outside the requested change.
            - Add or update focused tests.
            - Run the smallest relevant validation, then broader tests when practical.
            - Open a pull request with a concise summary and validation results.
            - Do not expose secrets or modify credentials.
